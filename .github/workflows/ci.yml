name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  release-preview:
    name: Publish source preview
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read preview version and release notes
        id: preview
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+-preview\.\d+$/.test(version)) process.exit(0);
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(/^## /m).find(entry => entry.startsWith(`${version} — `));
          if (!section) throw new Error(`Missing changelog for ${version}`);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-notes.md'), `## ${section}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${version}\n`);
          JS
      - name: Publish source-only prerelease
        if: steps.preview.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.preview.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; preserving its original contents."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "AgentBaton $RELEASE_TAG — 源码预览版" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
